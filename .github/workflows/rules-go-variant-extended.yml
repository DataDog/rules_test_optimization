name: rules_go variant extended

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: rules-go-variant-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-go-variant-extended:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.0"

      - name: Install Bazelisk
        shell: bash
        run: |
          GO111MODULE=on go install github.com/bazelbuild/bazelisk@v1.28.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run extended vendored rules_go coverage
        shell: bash
        run: |
          while IFS= read -r upstream; do
            RULES_GO_UPSTREAM="${upstream}" \
            RULES_GO_VARIANT="base" \
              ./tools/dev/run_rules_go_variant_extended.sh
          done < <(python3 tools/dev/materialize_rules_go_fork.py list-upstreams)
